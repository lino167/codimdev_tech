<!doctype html>
<html lang="pt-BR">
<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<div style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 30px">{{it.label}}</div>
</div>
</sc-for>
</div>
</x-dc>

}

</body>
</html>
